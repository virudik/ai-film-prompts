name: Scene 88 technical verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/scene88-technical-verification.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scene88-technical-verification
  cancel-in-progress: false
jobs:
  repair_and_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Script execution starts in scripts/; tests import both tests.* and scripts.*.
      PYTHONPATH: .
      EXPECTED_HOLDER: chatgpt:ordinary:8c9d9bd3-2401-4392-8f4f-2ecbc9a4cb2c
      EXPECTED_ACQUIRED_AT: '2026-11-10T19:54:00Z'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Verify all tests and live bytes, then publish minimal transaction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scene88-verification
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/scene88_technical_verification.py
            git diff --cached --stat > /tmp/scene88-verification/changed-files.txt
            git commit -m 'Fix five stale test guards; verify scene 88 live bytes and full suite'
            if git push origin HEAD:main; then
              git rev-parse HEAD > /tmp/scene88-verification/commit.txt
              published=true
              break
            fi
            echo 'Main moved; discard local transaction and re-run from fresh main.'
          done
          test "$published" = true
          git fetch origin main
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          report='reports/scene88-technical-verification-2026-11-10.json'
          raw=subprocess.check_output(['git','show','origin/main:'+report])
          assert raw==Path(report).read_bytes(),'committed report readback mismatch'
          data=json.loads(raw)
          assert data['tests']['all_tests_passed'] and data['live_publication']['all_verified']
          for path, evidence in data['test_files'].items():
              actual=subprocess.check_output(['git','show','origin/main:'+path])
              assert hashlib.sha256(actual).hexdigest()==evidence['after_sha256'],path
          print('COMMITTED_READBACK_OK',data['tests']['tests_run'],len(data['live_publication']['results']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene88-technical-repair-evidence
          path: /tmp/scene88-verification/
          retention-days: 3
