name: Shadow pilot takeover brief (not canonical)

# D7 accepted 14.10; Continue recovery upgrade 27.10. Derived views only.
# Same existing workflow, no new schedule. Rebuild after a CAS conflict; never
# rebase stale generated snapshots over newer canonical data.

on:
  workflow_dispatch:
  workflow_run:
    # GITHUB_TOKEN writes do not trigger push workflows. Rebuild after the
    # existing telemetry writer too, so its fresh project-status cannot leave
    # the recovery packet stale until the next half-hour canonical check.
    workflows: ['Canonical master check and owner buttons (GitHub main; Drive is only a copy)', 'Topview robot (scan + telemetry writer)', 'Projects status']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'NEW-CHAT-HANDOFF.md'
      - 'SYNC-RUNBOOK.md'
      - 'AI-PROJECT-GUIDE.md'
      - 'PROMPT-STYLE-GUIDE.md'
      - 'USER-GUIDE.md'
      - 'README-AI-SYNC.md'
      - 'BACKUP-AI-RUNBOOK.md'
      - 'video-prompts.md'
      - 'instruction-sync-status.json'
      - 'scripts/build_takeover_brief.py'
      - 'scripts/continue_preflight.py'
      - 'scripts/resume_state.py'
      - 'scripts/resume_project.py'
      - 'scripts/handoff_receipt.py'
      - 'projects/projects.json'
      - 'projects/README.md'
      - 'projects/*/HANDOFF.md'
      - 'projects/*/INSTRUCTIONS.md'
      - 'projects/*/work-resume-register.json'
      - 'projects/*/reports/**'
      - 'projects/*/video-prompts.md'
      - 'projects/*/project-status.json'
      - 'projects/*/ops/topview-launch-queue.json'
      - 'scripts/build_resume_packet.py'
      - 'work-resume-register.json'
      - 'reports/**'
      - 'ops/CONTINUE-PROTOCOL.md'
      - 'ops/topview-launch-queue.json'
      - 'project-status.json'
      - 'monitor-role.json'
      - '.github/workflows/shadow-brief.yml'

permissions:
  contents: write

concurrency:
  group: shadow-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Build and publish verified recovery views from fresh main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset --hard origin/main
            python3 scripts/build_takeover_brief.py . shadow
            python3 scripts/build_resume_packet.py . --all-projects
            git add shadow/takeover-brief.json shadow/takeover-brief.md shadow/current-checkpoint.md shadow/resume-packet.json shadow/resume-packet.md projects/*/shadow/resume-packet.json projects/*/shadow/resume-packet.md
            if git diff --cached --quiet; then
              echo "recovery views unchanged — no commit"
              exit 0
            fi
            git commit -m "Refresh verified Continue recovery views"
            if git push -q origin HEAD:main; then
              git fetch -q origin main
              for f in shadow/takeover-brief.json shadow/takeover-brief.md shadow/current-checkpoint.md shadow/resume-packet.json shadow/resume-packet.md projects/*/shadow/resume-packet.json projects/*/shadow/resume-packet.md; do
                test "$(git rev-parse HEAD:$f)" = "$(git rev-parse origin/main:$f)"
              done
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "Concurrent changes prevented publication; no stale snapshot pushed" >&2
          exit 1
