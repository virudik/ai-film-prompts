name: Owner parody scenes checkpoint
on:
  push:
    branches: [main]
    paths: [.github/workflows/parody-scenes-once.yml]
permissions:
  contents: write
jobs:
  save_publication_and_supplement_jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HOLDER: chatgpt:ordinary:cac9e536-4eed-49f1-bc08-397288c2c43d
      EXPECTED_ACQUIRED_AT: '2026-11-09T16:48:58Z'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Load exact reviewed non-media payload
        run: |
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import urllib.request,hashlib,zipfile,io
          url='https://drive.usercontent.google.com/download?id=1PpgKAzxDrI8VfG476Qij3N5QGbS9NtHk&export=download&confirm=t'
          with urllib.request.urlopen(url,timeout=45) as r:b=r.read(1000000)
          assert hashlib.sha256(b).hexdigest()=='3a16991f2cb26d5116ef6735605d289081da15f364ca2ee7d8df47c720a20d51'
          p=Path('/tmp/parody-supplement');p.mkdir()
          with zipfile.ZipFile(io.BytesIO(b)) as z:
            for n in z.namelist():
              q=PurePosixPath(n);assert not q.is_absolute() and '..' not in q.parts
              assert n in {'publish.py','supplementary-jobs.json','live-publication.json'} or (n.startswith('references/scenes/scene-') and n.endswith('.image-prompt.txt'))
            z.extractall(p)
          PY
      - name: Fresh-main guarded edit, tests and readback
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/parody-verification
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 /tmp/parody-supplement/publish.py /tmp/parody-supplement > /tmp/parody-verification/changes.json
            python3 scripts/check_instruction_consistency.py . > /tmp/parody-verification/instructions.json
            python3 scripts/validate_site.py . > /tmp/parody-verification/site.txt
            python3 -m unittest tests/test_continue_preflight.py tests/test_continue_recovery.py tests/test_project_recovery.py tests/test_instruction_consistency.py > /tmp/parody-verification/tests.txt 2>&1
            python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json,os
          p=Path('ops/canon-lock.json');l=json.loads(p.read_text());now=datetime.now(timezone.utc)
          assert l['state']=='held' and l['holder']==os.environ['EXPECTED_HOLDER'] and l['acquired_at']==os.environ['EXPECTED_ACQUIRED_AT'] and datetime.fromisoformat(l['expires_at'].replace('Z','+00:00'))>now
          l.update(state='free',expires_at=None,released_at=now.isoformat());p.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n')
          PY
            python3 scripts/build_takeover_brief.py . shadow
            python3 scripts/build_resume_packet.py . --all-projects
            python3 scripts/continue_preflight.py . --work-id SEREGIUS-PARODIES-20261109 > /tmp/parody-verification/preflight.json
            git add reports/parody-live-publication-2026-11-09.json reports/parody-supplementary-reference-jobs-2026-11-09.json reports/parody-scenes-2026-11-09.json references/scenes/scene-74/*.image-prompt.txt references/scenes/scene-76/*.image-prompt.txt references/scenes/scene-74/manifest.json references/scenes/scene-76/manifest.json ops/FUTURE-PLANS.md reports/current-work-checkpoint.md work-resume-register.json archive/work-resume-register-archive.json ops/canon-lock.json shadow projects/*/shadow/resume-packet.*
            git diff --cached --stat > /tmp/parody-verification/diff-stat.txt
            git commit -m 'Verify seven live parody frames; save seven pending supplemental image jobs and honest rejected-attempt checkpoint'
            if git push origin HEAD:main; then
              git fetch origin main
              for f in reports/parody-live-publication-2026-11-09.json reports/parody-supplementary-reference-jobs-2026-11-09.json reports/current-work-checkpoint.md; do test "$(git rev-parse HEAD:$f)" = "$(git rev-parse origin/main:$f)"; done
              git rev-parse HEAD > /tmp/parody-verification/published-commit.txt
              cp reports/parody-live-publication-2026-11-09.json /tmp/parody-verification/
              cp reports/parody-supplementary-reference-jobs-2026-11-09.json /tmp/parody-verification/
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parody-live-and-supplement-jobs-verification
          path: /tmp/parody-verification/*
          retention-days: 3
