name: Owner parody scenes checkpoint
on:
  push:
    branches: [main]
    paths: [.github/workflows/parody-scenes-once.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Load reviewed bounded source
        run: |
          git fetch origin 68e6ce44c41ad22f8375589e97e44bc51caa5dd6
          git show 68e6ce44c41ad22f8375589e97e44bc51caa5dd6:staging/parodies/scenes.json > /tmp/parody-scenes.json
          git show 68e6ce44c41ad22f8375589e97e44bc51caa5dd6:staging/parodies/publish.py > /tmp/parody-publish.py
      - name: Fresh-main publish under exact own lease, no queue writes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp video-prompts.md /tmp/old-master.md
            PYTHONPATH="$PWD/scripts" python3 /tmp/parody-publish.py /tmp/parody-scenes.json
            python3 scripts/cert_github.py .
            python3 scripts/build_project_status.py video-prompts.md --output project-status.json --synced-at "$(date -u +%FT%TZ)" --topview-status-file topview-status.json --topview-task-map-file topview-task-map.json --previous-status-file project-status.json --previous-master-file /tmp/old-master.md > /tmp/parody-status.json
            python3 scripts/check_instruction_consistency.py .
            python3 scripts/validate_site.py .
            python3 -m unittest tests/test_continue_preflight.py tests/test_continue_recovery.py tests/test_project_recovery.py tests/test_instruction_consistency.py > /tmp/parody-tests.txt 2>&1
            python3 - <<'PY'
          import json,sys,datetime
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from trim_service_files import trim_register
          p=Path('work-resume-register.json');a=Path('archive/work-resume-register-archive.json')
          out=trim_register(json.loads(p.read_text()),json.loads(a.read_text()) if a.exists() else {})
          if out:
            reg,archive,*_=out;p.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n');a.parent.mkdir(exist_ok=True);a.write_text(json.dumps(archive,ensure_ascii=False,indent=2)+'\n')
          lockp=Path('ops/canon-lock.json');l=json.loads(lockp.read_text());now=datetime.datetime.now(datetime.timezone.utc)
          assert l['holder']=='chatgpt:ordinary:4ce5446d-f8c0-480f-b26c-fd639124c132' and l['state']=='held' and datetime.datetime.fromisoformat(l['expires_at'])>now
          l.update(state='free',expires_at=None,released_at=now.isoformat());lockp.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n')
          PY
            python3 scripts/build_takeover_brief.py . shadow
            python3 scripts/build_resume_packet.py . --all-projects
            python3 scripts/continue_preflight.py . --work-id SEREGIUS-PARODIES-20261109 > /tmp/parody-preflight.json
            git add video-prompts.md SYNC-TRIGGER.txt project-status.json instruction-sync-status.json character-references.json NEW-CHAT-HANDOFF.md ops/FUTURE-PLANS.md reports/current-work-checkpoint.md reports/parody-scenes-2026-11-09.json reports/parody-scenes-source-2026-11-09.json work-resume-register.json archive/work-resume-register-archive.json ops/canon-lock.json references/scenes/scene-74 references/scenes/scene-75 references/scenes/scene-76 references/scenes/scene-77 references/scenes/scene-78 references/scenes/scene-79 references/scenes/scene-80 shadow projects/*/shadow/resume-packet.*
            git commit -m 'Add Seregius parody scenes 74–80 with 21 prompts, source notes and pending image manifests'
            if git push origin HEAD:main; then
              git fetch origin main
              for f in video-prompts.md reports/parody-scenes-2026-11-09.json character-references.json; do test "$(git rev-parse HEAD:$f)" = "$(git rev-parse origin/main:$f)"; done
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parody-publication-checks
          path: |
            /tmp/parody-status.json
            /tmp/parody-tests.txt
            /tmp/parody-preflight.json
          retention-days: 2
