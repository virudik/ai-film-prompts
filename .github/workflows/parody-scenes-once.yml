name: Owner parody scenes checkpoint
on:
  push:
    branches: [main]
    paths: [.github/workflows/parody-scenes-once.yml]
permissions:
  contents: write
jobs:
  save_existing_reference_and_cast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_HOLDER: chatgpt:ordinary:89544e09-ebc6-4549-a7df-654d7927f4e0
      EXPECTED_ACQUIRED_AT: '2026-11-09T14:59:38+00:00'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Load reviewed bounded changes and exact existing PNG
        run: |
          set -euo pipefail
          git fetch origin 970dca3c3da5d75cc0f303a77705e54054a6b01c
          git show 970dca3c3da5d75cc0f303a77705e54054a6b01c:staging/parodies/s77-adult-cast.py > /tmp/s77-cast.py
          git show 970dca3c3da5d75cc0f303a77705e54054a6b01c:staging/parodies/attach-s74-after-cast.py > /tmp/s74-attach.py
          python3 -m py_compile /tmp/s77-cast.py /tmp/s74-attach.py
          python3 - <<'PY'
          import urllib.request,hashlib
          from pathlib import Path
          expected='ef65d3aae1a4bdeb4f49d19c576136a7dffa0b8852be06e0affac76b3c443b18'
          urls=['https://drive.google.com/uc?export=download&id=1KUTkYLozDInRxvhRLd9eM7kcsxG_MDgi','https://drive.usercontent.google.com/download?id=1KUTkYLozDInRxvhRLd9eM7kcsxG_MDgi&export=download&confirm=t']
          for u in urls:
            try:
              with urllib.request.urlopen(u,timeout=40) as r: b=r.read(4000000)
              if len(b)==2473956 and hashlib.sha256(b).hexdigest()==expected:
                Path('/tmp/S74-studio-roar.png').write_bytes(b);break
            except Exception as e: print(type(e).__name__,str(e)[:160])
          else: raise SystemExit('Exact PNG unavailable; no substitute or main write allowed')
          print('Existing S74 PNG verified by SHA256; no generation performed')
          PY
      - name: Fresh-main guarded edit, tests, atomic commit and readback
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp video-prompts.md /tmp/parody-before-master.md
            python3 /tmp/s77-cast.py > /tmp/s77-result.json
            python3 /tmp/s74-attach.py > /tmp/s74-result.json
            python3 scripts/cert_github.py .
            python3 scripts/build_project_status.py video-prompts.md --output project-status.json --synced-at "$(date -u +%FT%TZ)" --topview-status-file topview-status.json --topview-task-map-file topview-task-map.json --previous-status-file project-status.json --previous-master-file /tmp/parody-before-master.md > /tmp/parody-status.json
            python3 - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          assert json.loads(Path('project-status.json').read_text())['health']=='ok'
          before=Path('/tmp/parody-before-master.md').read_text();after=Path('video-prompts.md').read_text()
          p=re.compile(r'(?ms)(^## Сцена (\d+) — .*?)(?=\n---\n\n<a id="scene-\d+"></a>|\Z)')
          a={int(m[2]):m[1] for m in p.finditer(before)};b={int(m[2]):m[1] for m in p.finditer(after)}
          assert a.keys()==b.keys() and all(a[i]==b[i] for i in a if i not in (74,77))
          assert all(b[77].count('@Image'+str(i)+' = '+name)==3 for i,name in enumerate(['references/full/vitalik.jpg','references/full/lesha.jpg','references/scenes/scene-67/S67-Masha-R-tatooine-sheet.png'],1))
          assert 'references/full/serega.jpg' not in b[77]
          assert hashlib.sha256(Path('references/scenes/scene-74/S74-studio-roar.png').read_bytes()).hexdigest()=='ef65d3aae1a4bdeb4f49d19c576136a7dffa0b8852be06e0affac76b3c443b18'
          print('Unrelated scenes unchanged; S77 exact three references in all three variants; S74 bytes verified')
          PY
            python3 scripts/check_instruction_consistency.py .
            python3 scripts/validate_site.py .
            python3 -m unittest tests/test_continue_preflight.py tests/test_continue_recovery.py tests/test_project_recovery.py tests/test_instruction_consistency.py > /tmp/parody-tests.txt 2>&1
            python3 - <<'PY'
          import json,datetime,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from trim_service_files import trim_register
          p=Path('work-resume-register.json');a=Path('archive/work-resume-register-archive.json')
          out=trim_register(json.loads(p.read_text()),json.loads(a.read_text()) if a.exists() else {})
          if out:
            reg,archive,*_=out;p.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n');a.write_text(json.dumps(archive,ensure_ascii=False,indent=2)+'\n')
          lp=Path('ops/canon-lock.json');l=json.loads(lp.read_text());now=datetime.datetime.now(datetime.timezone.utc)
          assert l['state']=='held' and l['holder']==os.environ['EXPECTED_HOLDER'] and l['acquired_at']==os.environ['EXPECTED_ACQUIRED_AT'] and datetime.datetime.fromisoformat(l['expires_at'].replace('Z','+00:00'))>now
          l.update(state='free',expires_at=None,released_at=now.isoformat());lp.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n')
          PY
            python3 scripts/build_takeover_brief.py . shadow
            python3 scripts/build_resume_packet.py . --all-projects
            python3 scripts/continue_preflight.py . --work-id SEREGIUS-PARODIES-20261109 > /tmp/parody-preflight.json
            git diff --exit-code -- ops/topview-launch-queue.json
            git add video-prompts.md SYNC-TRIGGER.txt project-status.json instruction-sync-status.json character-references.json NEW-CHAT-HANDOFF.md ops/FUTURE-PLANS.md reports/current-work-checkpoint.md reports/parody-scenes-2026-11-09.json reports/parody-scenes-source-2026-11-09.json work-resume-register.json archive/work-resume-register-archive.json ops/canon-lock.json references/scenes/scene-74 references/scenes/scene-77 shadow projects/*/shadow/resume-packet.*
            git commit -m 'Save first S74 scene still; correct all S77 prompts to adult Vitalik Alexey Masha; retain open tasks'
            if git push origin HEAD:main; then
              git fetch origin main
              for f in video-prompts.md references/scenes/scene-74/S74-studio-roar.png references/scenes/scene-77/manifest.json reports/parody-scenes-2026-11-09.json; do test "$(git rev-parse HEAD:$f)" = "$(git rev-parse origin/main:$f)"; done
              git rev-parse HEAD > /tmp/parody-published-commit.txt
              cat /tmp/s77-result.json /tmp/s74-result.json /tmp/parody-tests.txt /tmp/parody-published-commit.txt
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parody-s74-s77-verification
          path: |
            /tmp/s77-result.json
            /tmp/s74-result.json
            /tmp/parody-status.json
            /tmp/parody-tests.txt
            /tmp/parody-preflight.json
            /tmp/parody-published-commit.txt
          retention-days: 3
