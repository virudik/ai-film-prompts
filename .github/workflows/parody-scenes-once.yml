name: Owner parody scenes checkpoint
on:
  push:
    branches: [main]
    paths: [.github/workflows/parody-scenes-once.yml]
permissions:
  contents: write
jobs:
  record_failed_single_frame_attempts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Preserve existing images and checkpoint actual blocker under exact lease
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, sys
          sys.path.insert(0,'scripts')
          import resume_state
          now=datetime.now(timezone.utc)
          holder='chatgpt:ordinary:2bad7f77-bb65-4f34-9079-d49494e94399'
          acquired='2026-11-09T17:17:51+00:00'
          lp=Path('ops/canon-lock.json');lock=json.loads(lp.read_text())
          assert lock['state']=='held' and lock['holder']==holder and lock['acquired_at']==acquired
          assert datetime.fromisoformat(lock['expires_at'].replace('Z','+00:00'))>now
          protected=['video-prompts.md','ops/topview-launch-queue.json']
          before={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in protected}
          path=Path('reports/parody-supplementary-reference-jobs-2026-11-09.json');jobs=json.loads(path.read_text())
          assert jobs['work_id']=='SEREGIUS-PARODIES-20261109'
          attempts=[('f5e5fdec-4036-448a-aa02-ac8e838dd2f2','20313fe8e48303db73f5f13aa020decb35cf1b60aac6f8db226862b7484b1bc2',2178953),('6aca615c-2bf5-408d-a8b2-6cac815bc98f','f343e1e329142530d859c84daa7cc8ccd4592e9ac7716ee021d1d250685e15a1',2310427),('b2e525c3-7a9f-44b4-9ef5-ae53c7e5375e','59cef8526fb5d346ff8bcd9e46281d63f7d9241b6127f6fbded89db58c25c5e4',2080102)]
          rejection='Requested standalone S74 torch-curtain frame using exact supplied Vitalik face; returned a different roaring-logo composition with lettering and incorrect likeness. Not a requested frame or valid replacement. No collage, but still rejected.'
          history=jobs.setdefault('rejected_attempt_history',[])
          known={a['generation_id'] for a in history}
          for gen,sha,size in attempts:
            if gen not in known:history.append({'generation_id':gen,'sha256':sha,'bytes':size,'status':'rejected','reason':rejection,'published_as_reference':False,'requested_job':'S74-torch-curtain','recorded_at':now.isoformat()})
          jobs['last_execution']={'checked_at':now.isoformat(),'new_generated_outputs':3,'new_accepted_images':0,'new_images_attached':0,'published_primary_images_preserved':7,'video_submissions':0,'queue_changed':False,'browser_fallback':'Browser.list_tabs returned originating_browser_context_required','work_complete':False,'background_work_running':False}
          jobs['blocker']='Current native image requests return a roaring logo rather than the specified torch frame, despite supplied source/face and an explicit single-frame description. Do not accept these outputs or repeat the unchanged request. Authenticated free browser fallback unavailable in this surface.'
          next_action='Семь основных PNG и 21 промпт уже сохранены: не пересоздавать. Дополнительный S74-torch-curtain не получен: три новых ответа генератора дали другой рычащий логотип и отклонены. Сначала получить отдельный кадр факела с точным лицом Виталика в работающем одиночном редактировании; затем QC и PNG/SHA/manifest/master до следующего. Не активировать неверные лица/надписи; остальные семь дополнительных заданий остаются открытыми. Никакой процесс между сообщениями не выполняется.'
          jobs['next_action']=next_action
          path.write_text(json.dumps(jobs,ensure_ascii=False,indent=2)+'\n')
          reportp=Path('reports/parody-scenes-2026-11-09.json');report=json.loads(reportp.read_text())
          report['last_supplementary_attempt']={'checked_at':now.isoformat(),'report':str(path),'new_accepted_images':0,'new_images_attached':0,'published_primary_images_preserved':7,'work_complete':False}
          report['next_action']=next_action;report['updated_at']=now.isoformat()
          reportp.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          anchor='# 09.11.2026 — дополнительные кадры: новая попытка отклонена, семь основных сохранены'
          cp=Path('reports/current-work-checkpoint.md')
          if not cp.read_text().startswith(anchor):
            cp.write_text(anchor+'\n\nwork_id: SEREGIUS-PARODIES-20261109\n\n- Владелец просит доделать без коллажей. Три новых результата одиночного запроса — не коллажи, но снова рычащие логотипы вместо факела и без точного лица. Все отклонены; новых пригодных/прикреплённых PNG: 0.\n- Существующие семь основных PNG, состав S77 Виталик/взрослый Алексей/Маша Р, сцены, очередь и все 21 промпт сохранены без правок. Ни один неверный результат не заменяет рабочие референсы.\n- Browser.list_tabs: originating_browser_context_required. Бесплатный браузерный fallback не подтверждён. Никаких платных или видеозапусков, новых расписаний или фоновой работы.\n- Подробности и SHA отклонённых файлов: '+str(path)+'.\n- Следующий шаг: '+next_action+'\n\nchecked_at: '+now.isoformat()+'\n\n---\n\n'+cp.read_text())
          resume_state.capture('.', 'SEREGIUS-PARODIES-20261109', anchor, 'Семь основных PNG сохранены; три новых неверных логотипа отклонены. Дополнительный кадр факела не получен, замены не опубликованы.', next_action, [str(path)], [str(path),str(reportp),'video-prompts.md'], False)
          regp=Path('work-resume-register.json');reg=json.loads(regp.read_text())
          work=next(w for w in reg['active_work'] if w['work_id']=='SEREGIUS-PARODIES-20261109')
          work['status']='blocked_native_single_frame_output'
          work.setdefault('recovery',{})['blockers']=[jobs['blocker']]
          regp.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n')
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in before.items())
          for scene in range(74,81):
            mf=json.loads(Path(f'references/scenes/scene-{scene}/manifest.json').read_text())
            for ref in mf['references']:
              if ref.get('role')=='scene_staging':assert hashlib.sha256(Path(ref['path']).read_bytes()).hexdigest()==ref['sha256']
          from trim_service_files import trim_register
          ar=Path('archive/work-resume-register-archive.json')
          trimmed=trim_register(json.loads(regp.read_text()),json.loads(ar.read_text()) if ar.exists() else {})
          if trimmed:
            reg,archive,*_=trimmed;regp.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n');ar.write_text(json.dumps(archive,ensure_ascii=False,indent=2)+'\n')
          lock.update(state='free',expires_at=None,released_at=datetime.now(timezone.utc).isoformat())
          lp.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n')
          print('New accepted supplementary images: 0. Seven existing primary images and queue preserved. Work remains open.')
          PY
            python3 -m unittest tests/test_continue_preflight.py tests/test_continue_recovery.py tests/test_project_recovery.py
            python3 scripts/build_takeover_brief.py . shadow
            python3 scripts/build_resume_packet.py . --all-projects
            python3 scripts/continue_preflight.py . --work-id SEREGIUS-PARODIES-20261109
            git add reports/parody-supplementary-reference-jobs-2026-11-09.json reports/parody-scenes-2026-11-09.json reports/current-work-checkpoint.md work-resume-register.json archive/work-resume-register-archive.json ops/canon-lock.json shadow projects/*/shadow/resume-packet.*
            git commit -m 'Checkpoint rejected torch attempts; preserve all published parody references, no completion claim'
            if git push origin HEAD:main; then
              git fetch origin main
              test "$(git rev-parse HEAD:reports/parody-supplementary-reference-jobs-2026-11-09.json)" = "$(git rev-parse origin/main:reports/parody-supplementary-reference-jobs-2026-11-09.json)"
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
