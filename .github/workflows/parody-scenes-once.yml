name: Publish existing parody photographs
on:
  push:
    branches: [main]
    paths: [.github/workflows/parody-scenes-once.yml]
permissions:
  contents: write
concurrency:
  group: owner-parody-existing-photos
  cancel-in-progress: false
jobs:
  publish_existing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_HOLDER: chatgpt:ordinary:7b26b32b-87f6-4d5b-918c-7bbd5fca61e7
      EXPECTED_ACQUIRED_AT: '2026-11-09T20:11:23+00:00'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Load exact existing-image archive
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,zipfile,io
          from pathlib import Path
          urls=['https://drive.google.com/uc?export=download&id=1ZnrS9Nc8KnmYGVTDL7_7IjQ6TXxfRQxY','https://drive.usercontent.google.com/download?id=1ZnrS9Nc8KnmYGVTDL7_7IjQ6TXxfRQxY&export=download&confirm=t']
          expected='4ed1f1277f905ed30efa487ba17a789afff63d9a04dba9f33869b37ac16886a7'
          for u in urls:
            try:
              with urllib.request.urlopen(u,timeout=60) as r: raw=r.read(40000000)
              if len(raw)==34521707 and hashlib.sha256(raw).hexdigest()==expected: break
            except Exception as e: print(type(e).__name__)
          else: raise SystemExit('Exact source archive unavailable; no content publication')
          dest=Path('/tmp/parody-photo-publication');dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            for x in z.infolist():
              p=Path(x.filename)
              assert not p.is_absolute() and '..' not in p.parts and (x.external_attr>>16)&0o170000!=0o120000
            z.extractall(dest)
          print('Verified existing image archive; no generation')
          PY
      - name: Publish under exact lease, preserve prompts, test and read back
        run: |
          set -euo pipefail
          python3 -c 'from PIL import Image'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp video-prompts.md /tmp/parody-before-master.md
            python3 /tmp/parody-photo-publication/publish.py > /tmp/parody-photo-result.json
            python3 scripts/cert_github.py .
            python3 scripts/build_project_status.py video-prompts.md --output project-status.json --synced-at "$(date -u +%FT%TZ)" --topview-status-file topview-status.json --topview-task-map-file topview-task-map.json --previous-status-file project-status.json --previous-master-file /tmp/parody-before-master.md > /tmp/parody-photo-status.json
            python3 scripts/check_instruction_consistency.py .
            python3 scripts/validate_site.py .
            python3 -m unittest tests.test_continue_preflight tests.test_continue_recovery tests.test_project_recovery tests.test_instruction_consistency > /tmp/parody-photo-tests.txt 2>&1
            python3 - <<'PY'
          import json,hashlib,re
          from pathlib import Path
          assert json.loads(Path('project-status.json').read_text())['health']=='ok'
          before=Path('/tmp/parody-before-master.md').read_text();after=Path('video-prompts.md').read_text()
          assert re.findall(r'```.*?```',before,re.S)==re.findall(r'```.*?```',after,re.S)
          report=json.loads(Path('reports/parody-existing-photos-publication-2026-11-09.json').read_text())
          assert len(report['assets'])==14 and report['new_generated_images']==0
          assert all(hashlib.sha256(Path(x['path']).read_bytes()).hexdigest()==x['sha256'] for x in report['assets'])
          assert all(x['active_prompt_input'] is False for x in report['assets'] if x['publication_role']=='composition_draft')
          assert Path('parodies.html').read_text().count('<figure>')==14
          PY
            python3 scripts/build_takeover_brief.py . shadow
            python3 scripts/build_resume_packet.py .
            python3 scripts/continue_preflight.py . --work-id SEREGIUS-PARODIES-20261109 > /tmp/parody-photo-preflight.json
            git diff --exit-code -- ops/topview-launch-queue.json
            git add parodies.html archive/parody-74-80 references/scenes/scene-74/manifest.json references/scenes/scene-75/manifest.json video-prompts.md SYNC-TRIGGER.txt project-status.json instruction-sync-status.json NEW-CHAT-HANDOFF.md ops/FUTURE-PLANS.md reports/current-work-checkpoint.md reports/parody-existing-photos-publication-2026-11-09.json work-resume-register.json shadow
            git diff --cached --check
            git commit -m 'Publish 7 existing parody stills and 7 early composition drafts with separate roles'
            if git push origin HEAD:main; then
              git rev-parse HEAD > /tmp/parody-photo-commit.txt
              git fetch origin main
              for f in parodies.html video-prompts.md reports/parody-existing-photos-publication-2026-11-09.json; do test "$(git rev-parse HEAD:$f)" = "$(git rev-parse origin/main:$f)"; done
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Release only this exact lease
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import os,json
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('ops/canon-lock.json');l=json.loads(p.read_text())
          if l.get('state')=='held' and l.get('holder')==os.environ['EXPECTED_HOLDER'] and l.get('acquired_at')==os.environ['EXPECTED_ACQUIRED_AT']:
            l.update(state='free',expires_at=None,released_at=datetime.now(timezone.utc).isoformat());p.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n')
          PY
            git add ops/canon-lock.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Release exact existing-photo publication lease'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parody-existing-photo-publication-verification
          path: |
            /tmp/parody-photo-result.json
            /tmp/parody-photo-status.json
            /tmp/parody-photo-tests.txt
            /tmp/parody-photo-preflight.json
            /tmp/parody-photo-commit.txt
          retention-days: 3
