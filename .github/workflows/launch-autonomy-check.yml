# Daily: did the ChatGPT schedule launch Topview tasks on its own (without an open chat)?
# Read-only over the repository; writes reports/launch-autonomy.json and, when free slots
# stood idle with ready items, one comment in the robot's `topview-events` issue (owner 17.10.2026).
name: Launch autonomy check (daily)

on:
  schedule:
    - cron: '30 5 * * *'   # 08:30 Europe/Moscow
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: launch-autonomy-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 600
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check launches of the last 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/launch_autonomy_check.py . --hours 24 --notify
      - name: Commit the report when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/launch-autonomy.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Launch autonomy check: daily report"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*5))
          done
          echo "::warning::could not push the launch autonomy report"
