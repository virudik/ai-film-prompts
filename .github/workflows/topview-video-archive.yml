name: Archive successful Topview videos to Drive (private backup)

# Independent from editorial approvals and from canonical slow membership.
# Topview API: read-only. Drive: writes files in the dedicated backup subfolder.
# No Topview signed URLs, credentials, generated video bytes or user prompts in Git.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum videos per run (1-10)"
        required: false
        default: "2"
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/topview-video-archive.yml'
      - 'scripts/topview_video_archive.py'
      - 'tests/test_topview_video_archive.py'

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: topview-video-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      TOPVIEW_API_KEY: ${{ secrets.TOPVIEW_API_KEY }}
      TOPVIEW_UID: ${{ vars.TOPVIEW_UID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install only required libraries
        run: pip install --quiet google-auth requests
      - name: Syntax and offline guard tests
        run: |
          python3 -m py_compile scripts/topview_video_archive.py
          python3 -m unittest discover -s tests -p 'test_topview_video_archive.py'
      - name: Keyless login to Google
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' && env.TOPVIEW_API_KEY != '' && env.TOPVIEW_UID != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Copy and verify completed videos
        id: archive
        env:
          BATCH: ${{ github.event_name == 'push' && '1' || inputs.limit || '2' }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ] || [ -z "$TOPVIEW_API_KEY" ] || [ -z "$TOPVIEW_UID" ]; then
            echo "::error title=Topview archive::Missing Topview or Google WIF configuration"
            exit 1
          fi
          python3 scripts/topview_video_archive.py --limit "$BATCH"
      - name: Alert owner before Drive slot pool is exhausted
        if: ${{ always() && steps.archive.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f topview-archive-pool-health.json || exit 0
          left="$(python3 -c 'import json;print(json.load(open("topview-archive-pool-health.json"))["available"])')"
          open="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=topview-archive-pool&per_page=5" --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ "$left" -le 10 ] && [ -z "$open" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/labels" -f name=topview-archive-pool -f color=fbca04 >/dev/null 2>&1 || true
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="Topview MP4 archive: replenish owner-owned Google Drive upload slots" -f body="Remaining owner-owned Drive upload slots: $left. The service account cannot own new MP4 (Google storageQuotaExceeded). Replenish the private Drive folder 'AI Film Generated Videos/Available Upload Slots' via the user's Google Drive OAuth, register new slot IDs in topview-archive-seeds.json. Never create public MP4 GitHub releases, delete old backups, or weaken permissions. See ops/TOPVIEW-VIDEO-ARCHIVE.md." -f 'labels[]=topview-archive-pool' >/dev/null
          elif [ "$left" -gt 10 ] && [ -n "$open" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${open}" -f state=closed >/dev/null
          fi
      - name: Commit verified archive index only
        if: ${{ always() && steps.archive.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- topview-video-archive.json)" ]; then
            echo "No new verified video metadata to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topview-video-archive.json
          git commit -m "Archive Topview MP4: verified Drive backup metadata"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "::error title=Topview archive::Could not persist verified metadata"
          exit 1
