name: Site alert read-only canary (manual only)
on:
  workflow_dispatch:
    inputs:
      test_id:
        description: Exact previously authorized SITE_ALERT_V2_TEST ID
        required: true
        type: string
      recipient:
        description: Previously authorized test recipient
        required: true
        type: choice
        options: [dot, grok]
      test_address:
        description: Optional exact allowlisted test-only address; never changes production
        required: false
        type: choice
        default: configured
        options: [configured, 'GrokBotWake@cloud-248663208472330240']
      confirm_read_only:
        description: Explicitly authorize one read-only canary message
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: site-alert-canary
  cancel-in-progress: false
jobs:
  send:
    if: github.ref == 'refs/heads/main' && inputs.confirm_read_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Send only a read-only canary, no production receipt
        env:
          AGENT_RELAY_TOKEN: ${{ secrets.AGENT_RELAY_TOKEN }}
          TEST_ID: ${{ inputs.test_id }}
          RECIPIENT: ${{ inputs.recipient }}
          TEST_ADDRESS: ${{ inputs.test_address }}
        run: |
          args=()
          if [ -n "$TEST_ADDRESS" ] && [ "$TEST_ADDRESS" != configured ]; then
            args+=(--test-address "$TEST_ADDRESS")
          fi
          python3 scripts/site_alert_canary.py --test-id "$TEST_ID" --recipient "$RECIPIENT" --confirm-read-only "${args[@]}"
