name: Reconcile review ledger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'topview-task-map.json'
      - 'project-status.json'
      - 'scripts/reconcile_review_ledger.py'

permissions:
  contents: write

concurrency:
  group: review-ledger-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile technical result receipt only
        run: python3 scripts/reconcile_review_ledger.py
      - name: Validate ledger
        run: python3 scripts/validate_review_ledger.py
      - name: Publish if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add review-ledger.json
          if git diff --cached --quiet; then
            echo "Review ledger current."
            exit 0
          fi
          git commit -m "Reconcile review ledger"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent writer detected; rebuilding ledger from fresh origin (attempt $attempt)." >&2
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/reconcile_review_ledger.py
            python3 scripts/validate_review_ledger.py
            git add review-ledger.json
            if git diff --cached --quiet; then
              echo "Fresh origin already contains equivalent ledger state."
              exit 0
            fi
            git commit -m "Reconcile review ledger"
          done
          echo "Failed to publish reconciled ledger after safe retries." >&2
          exit 1
