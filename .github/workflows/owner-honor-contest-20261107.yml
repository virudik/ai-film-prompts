name: Owner HONOR contest rules correction 20261107
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-honor-contest-20261107.yml']
permissions:
  contents: write
concurrency:
  group: owner-honor-contest-20261107
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Load reviewed bounded editor and fix diagnosed formatting
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 084824815f55b0e51d6bdcc0f530955d13cb9420
          git show 084824815f55b0e51d6bdcc0f530955d13cb9420:.github/workflows/owner-honor-contest-20261107.yml > /tmp/reviewed-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('/tmp/reviewed-workflow.yml').read_text()
          start=source.index("          cat > /tmp/owner-contest.py <<'PY'\n")+len("          cat > /tmp/owner-contest.py <<'PY'\n")
          end=source.index('\n          PY\n',start)
          code=textwrap.dedent(source[start:end])+'\n'
          code=code.replace('chatgpt:ordinary:b47e82ee-0b5f-42ae-918b-5a5c197bc631','chatgpt:ordinary:4da17e84-e0d1-46e6-bc71-a69e46ce1296')
          code=code.replace('2026-11-07T20:10:11Z','2026-11-07T20:19:50Z').replace('2026-11-07T20:06:57Z','2026-11-07T20:19:50Z')
          needle='    updated=head+marker+tail\n'
          assert code.count(needle)==1
          code=code.replace(needle,"    tail=re.sub(r'\\n(?:[ \\t]*\\n){2,}', '\\n\\n', tail)\n"+needle)
          Path('/tmp/owner-contest.py').write_text(code)
          compile(code,'/tmp/owner-contest.py','exec')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Re-read main and save checkpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset --hard origin/main
            python3 /tmp/owner-contest.py checkpoint
            git add projects/raznoe/reports/current-work-checkpoint.md projects/raznoe/work-resume-register.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'ops: continue existing HONOR rules checkpoint after diagnosed formatting rejection'
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3
          done
      - name: Validate and publish only exact existing-scene correction
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset --hard origin/main
            python3 /tmp/owner-contest.py patch
            python3 scripts/projects.py . status --project raznoe --write || {
              python3 -c 'import json; d=json.load(open("projects/raznoe/project-status.json")); print({k:v for k,v in d.get("checks",{}).items() if not v}); print(d.get("warnings"))'
              exit 1
            }
            python3 scripts/projects.py . validate
            python3 -m unittest discover -s tests > /tmp/owner-tests.log 2>&1 || { tail -100 /tmp/owner-tests.log; exit 1; }
            python3 scripts/validate_site.py
            python3 /tmp/owner-contest.py finish
            git add projects/raznoe/video-prompts.md projects/raznoe/HANDOFF.md projects/raznoe/reports/honor-x9e-pro-contest-2026-11-07.md projects/raznoe/reports/current-work-checkpoint.md projects/raznoe/work-resume-register.json projects/raznoe/project-status.json projects/raznoe/reports/owner-followup-verification-2026-11-07.json ops/FUTURE-PLANS.md ops/canon-lock.json projects/raznoe/canon-lock.json .github/workflows/owner-honor-contest-20261107.yml
            git commit -m 'fix: verified HONOR contest 60–120s and no music; preserve existing scenes and verify assets'
            git fetch -q origin main
            python3 /tmp/owner-contest.py guard_remote
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 3
          done
          exit 1
      - name: Release only exact leases on validation failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/owner-contest.py
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset --hard origin/main
            python3 /tmp/owner-contest.py release
            git add ops/canon-lock.json projects/raznoe/canon-lock.json
            git commit -m 'ops: release exact contest-repair leases after failed validation; no unsafe publication'
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 3
          done
