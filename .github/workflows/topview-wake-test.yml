name: Topview event wake (read-only delivery test)

# channel=relay (current, 25.10): new issue + one Agent Relay DM to the subscribed ChatGPT inbox, sent by the robot identity
#   (resend_same_test=true re-sends the DM for an existing test issue: handler dedup check).
# channel=new_issue (V2 Gmail, paused): one new issue per test = one new mail thread; channel=issue18 (V1): issue #18 comment.

on:
  push:
    branches: [main]
    paths: [ops/topview-wake-test.json]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: topview-event-wake-test
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Post one bot test signal, without accessing Topview
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_RELAY_TOKEN: ${{ secrets.AGENT_RELAY_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          cfg = json.loads(Path('ops/topview-wake-test.json').read_text())
          if cfg.get('enabled') is not True:
              print('Test disabled in ops/topview-wake-test.json; nothing posted.')
              raise SystemExit(0)
          assert cfg['read_only'] is True
          test_id = cfg['test_id']
          assert re.fullmatch(r'[A-Za-z0-9_-]{8,80}', test_id)
          repo = 'repos/virudik/ai-film-prompts'
          def gh(*args, data=None):
              out = subprocess.run(['gh', 'api', *args], input=None if data is None else json.dumps(data),
                                   check=True, capture_output=True, text=True).stdout
              return json.loads(out) if out.strip() else None
          if cfg.get('channel') == 'relay':
              label, marker = 'topview-slot-wake', 'TOPVIEW_RELAY_WAKE_TEST_V1'
              subprocess.run(['gh', 'api', repo + '/labels', '-f', 'name=' + label, '-f', 'color=d93f0b'],
                             capture_output=True, text=True)
              issues = [i for page in gh('--paginate', '--slurp', f'{repo}/issues?state=all&labels={label}&per_page=100')
                        for i in page]
              mine = [i for i in issues if test_id in i['title']]
              if mine and not cfg.get('resend_same_test'):
                  print('This test signal already exists; no duplicate.')
                  raise SystemExit(0)
              if mine:
                  issue = mine[0]
              else:
                  body = ('**Тест пробуждения через Agent Relay — это не сигнал свободного слота**\n\n'
                          + marker + '\ntest_id: ' + test_id + '\nread_only: true\nnew_submissions: 0\n\n'
                          'Не создавать видео, не занимать слот, не менять очередь. '
                          'Ожидается только ACK по ops/TOPVIEW-EVENT-WAKE.md.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')
                  issue = gh(repo + '/issues', '--method', 'POST', '--input', '-',
                             data={'title': f'{marker} · {test_id}', 'body': body, 'labels': [label]})
                  print('Test issue:', issue['html_url'])
              text = (marker + '\ntest_id: ' + test_id + '\nissue: ' + issue['html_url'] +
                      '\nread_only: true\nnew_submissions: 0\nrepo: virudik/ai-film-prompts (main)\n'
                      'Тест: без Create, claim и видео. ACK — в reports/topview-event-wake.json по ops/TOPVIEW-EVENT-WAKE.md.')
              Path('/tmp/relay-test.txt').write_text(text)
              data = json.dumps({'marker': marker, 'test_id': test_id, 'issue_number': issue['number'],
                                 'issue_url': issue['html_url'], 'read_only': True,
                                 'resend': bool(mine)})
              rc = subprocess.run(['python3', 'scripts/relay_wake.py', '.', '--text-file', '/tmp/relay-test.txt',
                                   '--data-json', data]).returncode
              raise SystemExit(rc)
          if cfg.get('channel', 'issue18') == 'new_issue':
              # V2: a NEW issue = a NEW mail thread with a unique subject "[virudik/ai-film-prompts] TOPVIEW_WAKE_TEST_V2 ..."
              label, marker = 'topview-slot-wake', 'TOPVIEW_WAKE_TEST_V2'
              subprocess.run(['gh', 'api', repo + '/labels', '-f', 'name=' + label, '-f', 'color=d93f0b'],
                             capture_output=True, text=True)
              issues = [i for page in gh('--paginate', '--slurp', f'{repo}/issues?state=all&labels={label}&per_page=100')
                        for i in page]
              if any(test_id in i['title'] for i in issues):
                  print('This test signal already exists; no duplicate.')
                  raise SystemExit(0)
              body = ('**Тест событийного запуска — это не сигнал свободного слота**\n\n'
                      '@virudik — проверка: новое письмо → запуск исполнителя → ACK.\n\n'
                      + marker + '\ntest_id: ' + test_id + '\nread_only: true\nnew_submissions: 0\n\n'
                      'Не создавать видео, не занимать слот, не менять очередь. '
                      'Ожидается только ACK по ops/TOPVIEW-EVENT-WAKE.md.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')
              made = gh(repo + '/issues', '--method', 'POST', '--input', '-',
                        data={'title': f'{marker} · {test_id}', 'body': body, 'labels': [label]})
              print('Test issue:', made['html_url'])
              for i in issues:
                  if i['state'] == 'open' and i['title'].startswith(marker):
                      gh(f"{repo}/issues/{i['number']}", '--method', 'PATCH', '--input', '-',
                         data={'state': 'closed', 'state_reason': 'completed'})
              raise SystemExit(0)
          endpoint = repo + '/issues/18/comments'
          marker = 'TOPVIEW_WAKE_TEST_V1\ntest_id: ' + test_id
          pages = gh('--paginate', '--slurp', endpoint + '?per_page=100')
          if any(marker in c.get('body', '') and c['user']['login'] == 'github-actions[bot]'
                 for page in pages for c in page):
              print('This test signal already exists; no duplicate.')
          else:
              body = ('**Тест событийного запуска — это не сигнал свободного слота**\n\n'
                      '@virudik — проверка доставки уведомления и пробуждения ChatGPT.\n\n'
                      + marker + '\nread_only: true\nnew_submissions: 0\n\n'
                      'Не создавать видео, не занимать слот, не менять очередь. '
                      'Ожидается только проверка доставки и ACK по ops/TOPVIEW-EVENT-WAKE.md.')
              made = gh(endpoint, '--method', 'POST', '--input', '-', data={'body': body})
              print('Test comment:', made['html_url'])
          PY
