name: AI Film integration recovery tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/test_recovery_integration.py'
      - 'tests/test_continue_preflight.py'
      - 'tests/test_continue_recovery.py'
      - 'scripts/continue_preflight.py'
      - 'scripts/resume_state.py'
      - 'scripts/build_resume_packet.py'
      - 'scripts/build_takeover_brief.py'
      - 'continue-status.js'
      - 'tests/continue_status_check.js'
      - 'tests/test_revision_date.py'
      - 'tests/test_monitor_failover.py'
      - 'tests/test_topview_light_check.py'
      - 'scripts/topview_light_check.py'
      - 'scripts/topview_api_scan.py'
      - 'scripts/drive_write.py'
      - 'tests/test_drive_copy.py'
      - 'tests/test_topview_api_scan.py'
      - 'tests/test_topview_prompt_match.py'
      - 'scripts/topview_prompt_match.py'
      - 'scripts/monitor_publish.py'
      - 'scripts/operation_journal.py'
      - 'scripts/cert_github.py'
      - 'scripts/check_instruction_consistency.py'
      - 'scripts/robot_site_actions.py'
      - 'tests/test_instruction_consistency.py'
      - 'tests/test_site_actions.py'
      - 'tests/test_inbox_archive.py'
      - 'tests/test_operation_journal.py'
      - 'tests/test_owner_decisions.py'
      - 'scripts/process_owner_decisions.py'
      - 'scripts/robot_master_actions.py'
      - 'scripts/master_scene_edit.py'
      - 'scripts/master_slow_edit.py'
      - 'tests/test_master_actions.py'
      - 'tests/test_robot_telemetry.py'
      - 'scripts/robot_telemetry.py'
      - 'scripts/trim_service_files.py'
      - 'scripts/canon_health.py'
      - 'tests/test_trim_service_files.py'
      - 'tests/test_slot_rewake.py'
      - 'tests/test_relay_retention.py'
      - 'tests/test_topview_video_archive.py'
      - 'scripts/topview_video_archive.py'
      - 'tests/robot_fixture.py'
      - 'scripts/monitor_role.py'
      - 'scripts/monitor_status.py'
      - '.github/workflows/test-recovery-integration.yml'
      - 'scripts/build_project_status.py'
      - 'video-prompts.md'
      - 'topview-checkpoint.json'
      - 'instruction-sync-status.json'
      - 'NEW-CHAT-HANDOFF.md'

permissions:
  contents: read

concurrency:
  group: recovery-integration-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run offline canonical and monitor failover regression tests
        run: python3 -m unittest -v tests/test_recovery_integration.py tests/test_revision_date.py tests/test_monitor_failover.py tests/test_owner_decisions.py tests/test_topview_light_check.py tests/test_master_actions.py tests/test_topview_api_scan.py tests/test_topview_prompt_match.py tests/test_drive_copy.py tests/test_robot_telemetry.py tests/test_topview_video_archive.py tests/test_trim_service_files.py tests/test_slot_rewake.py tests/test_relay_retention.py tests/test_operation_journal.py tests/test_instruction_consistency.py tests/test_site_actions.py tests/test_inbox_archive.py tests/test_continue_preflight.py tests/test_continue_recovery.py
      - name: Check repository instruction consistency (live Automations checked separately)
        run: python3 scripts/check_instruction_consistency.py .
      - name: Verify Continue indicator failure states
        run: node tests/continue_status_check.js
