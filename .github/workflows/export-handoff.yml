name: Export canonical handoff artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-handoff.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-handoff
          path: NEW-CHAT-HANDOFF.md
          if-no-files-found: error
          retention-days: 1
