name: Sync instruction status metadata

on:
  push:
    branches: [main]
    paths:
      - 'SYNC-TRIGGER.txt'
      - '.github/workflows/one-time-sync-instruction-status.yml'

permissions:
  contents: write

concurrency:
  group: instruction-status-sync
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current sync time into instruction copies
        shell: bash
        run: |
          set -euo pipefail
          RU_FILES=(SYNC-RUNBOOK.md USER-GUIDE.md README-AI-SYNC.md CLAUDE-TAKEOVER-RUNBOOK.md)
          for f in "${RU_FILES[@]}"; do
            sed -i 's/2026-09-17 · 14:13 (+03:00)/2026-09-17 · 15:00 (+03:00)/g' "$f"
            sed -i 's/2026-09-17 · 14:40 (+03:00)/2026-09-17 · 15:00 (+03:00)/g' "$f"
            if ! grep -q 'Текущее зафиксированное время полной синхронизации' "$f"; then
              perl -0pi -e 's/(Текущий контрольный снимок проекта:.*?\n)/$1\nТекущее зафиксированное время полной синхронизации: **2026-09-17 · 15:00 (+03:00)**.\n/' "$f"
            fi
          done
          sed -i 's/2026-09-17 · 14:13 (+03:00)/2026-09-17 · 15:00 (+03:00)/g' AI-PROJECT-GUIDE.md
          sed -i 's/2026-09-17 · 14:40 (+03:00)/2026-09-17 · 15:00 (+03:00)/g' AI-PROJECT-GUIDE.md
          if ! grep -q 'Current recorded full-sync time' AI-PROJECT-GUIDE.md; then
            perl -0pi -e 's/(Current control snapshot:.*?\n)/$1\nCurrent recorded full-sync time: **2026-09-17 · 15:00 (+03:00)**.\n/' AI-PROJECT-GUIDE.md
          fi

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SYNC-RUNBOOK.md USER-GUIDE.md README-AI-SYNC.md AI-PROJECT-GUIDE.md CLAUDE-TAKEOVER-RUNBOOK.md
          if git diff --cached --quiet; then
            echo "No instruction changes."
            exit 0
          fi
          git commit -m "Sync revision status metadata across instructions"
          git push
