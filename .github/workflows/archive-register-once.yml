name: Archive completed recovery history once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-register-once.yml']
permissions:
  contents: write
concurrency:
  group: register-archive-20261108
  cancel-in-progress: false
jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Archive only completed history and validate the recovery binding
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/archive_register_once.py /tmp/archive_register_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git reset --hard origin/main
            python3 /tmp/archive_register_once.py apply
            git diff --check
            git add work-resume-register.json archive/work-resume-register-archive.json reports/register-archive-2026-11-08.json ops/FUTURE-PLANS.md canon-health.json shadow/resume-packet.json shadow/resume-packet.md ops/canon-lock.json
            git add -u -- scripts/archive_register_once.py .github/workflows/archive-register-once.yml
            git commit -m 'Archive completed register history; recovery preserved, canon health verified'
            made=$(git rev-parse HEAD)
            if git push origin HEAD:main; then
              git fetch -q origin main
              git merge-base --is-ancestor "$made" origin/main
              echo "Verified archival commit $made"
              exit 0
            fi
            echo 'CAS rejected: reread main and recompute archival without replay.'
          done
          exit 1
      - name: Release only the exact owned lease
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/archive_register_once.py || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git reset --hard origin/main
            python3 /tmp/archive_register_once.py release
            git add ops/canon-lock.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Canon lock: release exact archival lease'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
