name: HONOR scenes completion
on:
  push:
    branches: [main]
    paths: [.github/workflows/honor-scenes-completion.yml]
permissions:
  contents: write
  id-token: write
concurrency:
  group: honor-scenes-completion
  cancel-in-progress: false
jobs:
  reference_integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PHASE: apply
      HOLDER: chatgpt:ordinary:e586d119-1d26-4f50-8bf8-9c95d64588be
      BUNDLE_ID: 1RyTXjlq5N10Gcg3G-ZI8wTd5Zx9TnRyk
      BUNDLE_SHA: 7b7f79cda2fdb215f539f0c0820fad20bf827450e30a06f57cbaaa29aef5be6f
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Verify exact private transfer and matching leases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/honor-reference-evidence /tmp/honor-reference-bundle
          python3 - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from datetime import datetime,timezone
          from pathlib import Path,PurePosixPath
          import google.auth
          from google.auth.transport.requests import AuthorizedSession
          for p in ['ops/canon-lock.json','projects/raznoe/canon-lock.json']:
              l=json.loads(Path(p).read_text());assert l['state']=='held' and l['holder']==os.environ['HOLDER']
              assert datetime.fromisoformat(l['expires_at'].replace('Z','+00:00'))>datetime.now(timezone.utc)
          credentials,_=google.auth.default(scopes=['https://www.googleapis.com/auth/drive.readonly'])
          session=AuthorizedSession(credentials)
          r=session.get('https://www.googleapis.com/drive/v3/files/'+os.environ['BUNDLE_ID'],params={'alt':'media'},timeout=90);r.raise_for_status()
          assert hashlib.sha256(r.content).hexdigest()==os.environ['BUNDLE_SHA'],'bundle SHA mismatch'
          raw=Path('/tmp/honor-reference-bundle/input.zip');raw.write_bytes(r.content)
          with zipfile.ZipFile(raw) as z:
              for name in z.namelist():
                  p=PurePosixPath(name);assert not p.is_absolute() and '..' not in p.parts
                  assert name in ['assets.json','integrate.py','qa.py'] or name.startswith(('projects/raznoe/references/scenes/scene-4/','projects/raznoe/references/scenes/scene-5/'))
              z.extractall('/tmp/honor-reference-bundle/files')
          b=Path('/tmp/honor-reference-bundle/files')
          assert hashlib.sha256((b/'integrate.py').read_bytes()).hexdigest()=='89bc41a9db983c1844a1c8fa6095a606af9f17c22ad5c599fc83d32549574c00'
          assert hashlib.sha256((b/'qa.py').read_bytes()).hexdigest()=='467a06d22677d949e5704a8e5ea567929daffd91c0b4ed94432cbc4b6623e942'
          items=json.loads((b/'assets.json').read_text())['images'];assert len(items)==6
          for row in items:
              for key,hkey in [('path','sha256'),('preview','preview_sha256')]:
                  assert hashlib.sha256((b/row[key]).read_bytes()).hexdigest()==row[hkey]
          result={'checked_at':datetime.now(timezone.utc).isoformat(),'bundle_sha256':os.environ['BUNDLE_SHA'],'images_verified':6,'previews_verified':6,'source_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'phase':os.environ['PHASE']}
          Path('/tmp/honor-reference-evidence/transfer-readback.json').write_text(json.dumps(result,indent=2)+'\n')
          print('TRANSFER_VERIFIED',result)
          PY
          python3 scripts/continue_preflight.py . --project raznoe > /tmp/honor-reference-evidence/preflight.txt
      - name: Apply, test and publish minimal transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/honor_reference_transaction.py
            git diff --cached --stat > /tmp/honor-reference-evidence/diff-stat.txt
            git commit -m 'Bind six HONOR images and 39 prompts to exact device model sources; preserve approvals'
            if git push origin HEAD:main; then
              git rev-parse HEAD > /tmp/honor-reference-evidence/commit.txt
              published=true
              break
            fi
            echo 'Main changed: discard transaction and reapply from fresh main, never replay a stale patch.'
          done
          test "$published" = true
          git fetch origin main
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p='projects/raznoe/reports/honor-reference-integration.json'
          raw=subprocess.check_output(['git','show','origin/main:'+p]);assert raw==Path(p).read_bytes()
          r=json.loads(raw);assert r['test_results']['all_tests_passed']
          for a in r['assets']:
              for key,hkey in [('path','sha256'),('preview','preview_sha256')]:
                  data=subprocess.check_output(['git','show','origin/main:'+a[key]])
                  assert hashlib.sha256(data).hexdigest()==a[hkey],a[key]
          assert hashlib.sha256(subprocess.check_output(['git','show','origin/main:projects/raznoe/video-prompts.md'])).hexdigest()==r['master_sha256']
          print('COMMITTED_READBACK_OK',r['test_results']['tests_run'],len(r['assets']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: honor-reference-integration-evidence
          path: /tmp/honor-reference-evidence/
          retention-days: 3
