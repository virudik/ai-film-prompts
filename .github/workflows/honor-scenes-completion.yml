name: HONOR scenes completion
on:
  push:
    branches: [main]
    paths: [.github/workflows/honor-scenes-completion.yml]
permissions:
  contents: read
concurrency:
  group: honor-scenes-completion
  cancel-in-progress: false
jobs:
  exact_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Download official X9e Pro source pixels for private technical review
        run: |
          mkdir -p /tmp/honor-x9e-sources
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json,hashlib,urllib.request,struct
          holder='chatgpt:ordinary:79b0c146-b9a1-46f2-8187-6be9bd781ec4'
          for p in ['ops/canon-lock.json','projects/raznoe/canon-lock.json']:
              l=json.loads(Path(p).read_text());assert l['state']=='held' and l['holder']==holder
              assert datetime.fromisoformat(l['expires_at'])>datetime.now(timezone.utc)
          out=Path('/tmp/honor-x9e-sources');rows=[]
          for role,side in [('X-BACK','back'),('X-FRONT','front')]:
              url='https://www-file.honor.com/content/dam/honor/common/product-list/product-series/honor-x9e-pro/honor-x9e-pro-purple-'+side+'.png'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 HONOR-source-QC','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as r:
                  raw=r.read();status=r.status;mime=r.headers.get('Content-Type')
              assert raw[:8]==b'\x89PNG\r\n\x1a\n'
              path=out/(role+'-official-source.png');path.write_bytes(raw)
              rows.append({'slot':role,'file':path.name,'source_page':'https://www.honor.com/eurasia/phones/honor-x9e-pro/spec/','image_url':url,'http':status,'content_type':mime,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'pixels':struct.unpack('>II',raw[16:24]),'kind':'official_source_not_generated','rights':'private_technical_reference_only','color':'Purple reference; actual contest handset color not promised'})
          (out/'sources.json').write_text(json.dumps({'checked_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),'source_found_in':'official HTML downloaded in workflow 42908666731','items':rows,'no_scene_approval':True,'no_submission':True},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: honor-x9e-official-sources
          path: /tmp/honor-x9e-sources/
          retention-days: 3
