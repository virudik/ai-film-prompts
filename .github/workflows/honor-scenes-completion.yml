name: HONOR scenes completion
on:
  push:
    branches: [main]
    paths: [.github/workflows/honor-scenes-completion.yml]
permissions:
  contents: write
concurrency:
  group: honor-scenes-completion
  cancel-in-progress: false
jobs:
  complete_and_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Apply scoped project changes and verify full suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/honor-completion
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/complete_honor_scenes.py');s=p.read_text()
          needle=" run('resume-packet-final',['python3','scripts/build_resume_packet.py','.','--project','raznoe']);run('preflight-final',['python3','scripts/continue_preflight.py','.','--project','raznoe'])"
          fix=" capture('.', 'RAZNOE-HONOR-X9EPRO-CONTEST-20261107',anchor,done,next5,[REPORT],[str(R5/'shooting-package.md'),str(R4/'production-package.md')],True,project='raznoe')\n"+needle
          if fix not in s:
              assert s.count(needle)==1
              p.write_text(s.replace(needle,fix))
          PY
            python3 scripts/complete_honor_scenes.py
            git add -- scripts/complete_honor_scenes.py
            git diff --cached --stat > /tmp/honor-completion/changed-files.txt
            git diff --cached > /tmp/honor-completion/published.patch
            git commit -m 'Complete HONOR 4/5 editorial packages, exact sources and approved Moscow concept; no media launch'
            if git push origin HEAD:main; then
              git rev-parse HEAD > /tmp/honor-completion/commit.txt
              published=true
              break
            fi
            echo 'Main changed: discard local transaction, reread main and recalculate.'
          done
          test "$published" = true
          git fetch origin main
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p='projects/raznoe/reports/honor-scenes-4-5-completion.json'
          raw=subprocess.check_output(['git','show','origin/main:'+p]);assert raw==Path(p).read_bytes()
          r=json.loads(raw);assert r['tests']['all_tests_passed'] and r['scenes1_2_3_unchanged']
          for p,digest in r['files'].items():
              actual=subprocess.check_output(['git','show','origin/main:'+p]);assert hashlib.sha256(actual).hexdigest()==digest,p
          print('COMMITTED_READBACK_OK',r['tests']['tests_run'],len(r['files']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: honor-scenes-completion-evidence
          path: /tmp/honor-completion/
          retention-days: 3
