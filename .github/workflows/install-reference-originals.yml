name: Install full-resolution character references

on:
  push:
    paths:
      - "_reference-originals.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exact original reference sheets
        run: |
          mkdir -p references/full
          unzip -o _reference-originals.zip -d references/full
          rm _reference-originals.zip
      - name: Commit installed originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Install full-resolution character references"
            git push
          fi
