name: Validate Control Center

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/validate_site.py'
      - 'film.html'
      - 'references.html'
      - 'film-order.json'
      - 'review-ledger.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/validate_site.py
