name: Recover existing misc Topview references once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/misc-import-existing-refs.yml'
      - 'projects/misc/references/topview-source-map.json'
permissions:
  contents: write
concurrency:
  group: misc-import-existing-refs
  cancel-in-progress: false
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TOPVIEW_ZIP_URL: "https://du9d8548ooqnc.cloudfront.net/board/3db83056ccef4361a9563a4f77afa1d5/batch-download/261102_batch_9068.zip?Policy=eyJTdGF0ZW1lbnQiOiBbeyJSZXNvdXJjZSI6Imh0dHBzOi8vKi9ib2FyZC8zZGI4MzA1NmNjZWY0MzYxYTk1NjNhNGY3N2FmYTFkNS9iYXRjaC1kb3dubG9hZC8yNjExMDJfYmF0Y2hfOTA2OC56aXAiLCJDb25kaXRpb24iOnsiRGF0ZUxlc3NUaGFuIjp7IkFXUzpFcG9jaFRpbWUiOjE3OTQ3ODcxOTl9fX1dfQ__&Signature=TZK1xy9~CpCphzZVcDAV~9sc6tehlRPXNGMBbc839sOTGCR~PcVOcOSGi7-EioriCa9VsqwqC7XuiHFrPXneaz917i6tksyDx-uJW76d04tzJMF86uSncNr8lctsf6nShH~llAPpGBvXqzax5AGGE9YJPWwrzCTGlT7oQm3AfRpTq1gQisEGF47hE6j2JzMC65mz~MJqz~sYNYss1zyVdvApWmj1SCSTJ3jFta5iKof5ve8XoPHal-4xlQY7yxc8FLk8LTXSJQj374S768V0~jzsolB9TlQS-1-IjV9p0vX7X70smyiQjtFqSoBF3sbSEjPWYPI3VLKgutwC~gxM1w__&Key-Pair-Id=K1PJBMEIA4Y1WS"
      EXPECTED_HOLDER: chatgpt:ordinary:ee316c5a-5a59-4507-b79c-a8a13dcb2f00
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local image validator
        run: python3 -m pip install --quiet pillow
      - name: Download previously created zero-credit Topview originals
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --connect-timeout 25 --max-time 480 "$TOPVIEW_ZIP_URL" --output "$RUNNER_TEMP/misc-source.zip"
          python3 - "$RUNNER_TEMP/misc-source.zip" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert len(z.namelist()) == 56
              print("Existing image files verified:",len(z.namelist()))
          PY
      - name: Restore images and update misc site, manifests, and progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet main
            git reset --quiet --hard origin/main
            python3 - <<'PY'
          import datetime,json,os
          from pathlib import Path
          p=Path("projects/misc/canon-lock.json")
          l=json.loads(p.read_text())
          assert l.get("state")=="held" and l.get("holder")==os.environ["EXPECTED_HOLDER"],"Foreign or missing misc lock"
          assert datetime.datetime.fromisoformat(l["expires_at"].replace("Z","+00:00"))>datetime.datetime.now(datetime.timezone.utc),"Misc lock expired; refuse write"
          print("Authorized project lock:",l["holder"])
          PY
            python3 projects/misc/tools/import_topview_reference_pack.py --source-zip "$RUNNER_TEMP/misc-source.zip" --source-map projects/misc/references/topview-source-map.json
            python3 scripts/projects.py . status --project misc --write
            python3 scripts/projects.py . validate
            python3 -m unittest discover -s tests
            git add projects/misc
            if git diff --cached --quiet; then
              echo "No new changes"; exit 0
            fi
            git commit --quiet -m "Restore 59 misc scene references from originals (zero new generations)"
            if git push --quiet origin HEAD:main; then
              echo "Published 59 canonical references"
              exit 0
            fi
            echo "main advanced before upload attempt $attempt; reload and retry"
            sleep 7
          done
          echo "::error::Failed publishing recovered references after 3 attempts"
          exit 1
