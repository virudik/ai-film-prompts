name: Sync canonical master from Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'SYNC-TRIGGER.txt'
      - '.github/workflows/sync-from-drive.yml'

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download canonical video-prompts.md from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1yoUVfEAumOClvlBg8prFIX_BFFfoCZqj&export=download&confirm=t" \
            -o video-prompts.md

          test -s video-prompts.md
          if grep -qi '<!doctype html\|accounts.google.com' video-prompts.md; then
            echo "Refusing to use HTML/login response as video-prompts.md" >&2
            exit 1
          fi
          grep -q '^# Актуальные видео-сцены и промты' video-prompts.md
          grep -q 'Канонический источник' video-prompts.md

      - name: Commit only when master changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-prompts.md
          if git diff --cached --quiet; then
            echo "No master changes to sync."
            exit 0
          fi
          git commit -m "Sync canonical video-prompts.md from Google Drive"
          git push
