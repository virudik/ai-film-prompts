name: Canonical master check and owner buttons (GitHub main; Drive is only a copy)

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - 'SYNC-TRIGGER.txt'
      - '.github/workflows/sync-from-drive.yml'
      - 'scripts/build_project_status.py'
      - 'scripts/queue_readiness.py'
      - 'ops/topview-launch-queue.json'
      - 'instruction-sync-status.json'
      - 'NEW-CHAT-HANDOFF.md'
      - 'SYNC-RUNBOOK.md'
      - 'AI-PROJECT-GUIDE.md'
      - 'PROMPT-STYLE-GUIDE.md'
      - 'USER-GUIDE.md'
      - 'README-AI-SYNC.md'
      - 'BACKUP-AI-RUNBOOK.md'

permissions:
  contents: write
  issues: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    # Bot pushes must not loop the robot; a bot dispatch (self-heal restart) is allowed.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Canonical master from GitHub (owner decision 11.10.2026 03:25 MSK)
        shell: bash
        run: |
          set -euo pipefail
          # Since 11.10.2026 the editable canonical master and the 7 instructions live in
          # GitHub main. Google Drive is a read-only copy refreshed periodically; it is
          # never pulled over GitHub (see the drift guard step below).
          cp video-prompts.md /tmp/drive-video-prompts.md
          test -s /tmp/drive-video-prompts.md
          grep -q '^# Актуальные видео-сцены и промты' /tmp/drive-video-prompts.md
          grep -q 'Канонический источник' /tmp/drive-video-prompts.md

      - name: Recertify instructions edited without cert_github.py (owner decision 19.10.2026)
        shell: bash
        run: |
          set -euo pipefail
          # An instruction edit pushed without `cert_github.py` turned the site red and stopped the Topview
          # robot (18.10, 19.10). Main is the canon, so the certificate only records the hashes of what is
          # on main: refresh it here and name the commit that skipped it.
          python3 - > /tmp/cert-stale.txt <<'PY'
          import hashlib, json, subprocess
          d = json.load(open("instruction-sync-status.json", encoding="utf-8"))
          for name, info in d.get("files", {}).items():
              blob = subprocess.check_output(["git", "hash-object", name], text=True).strip()
              sha = hashlib.sha256(open(name, "rb").read()).hexdigest()
              if info.get("github_blob") != blob or info.get("mirror_sha256") != sha:
                  print(name)
          PY
          if [ ! -s /tmp/cert-stale.txt ]; then echo "instruction certificate current"; exit 0; fi
          STALE="$(paste -sd' ' /tmp/cert-stale.txt)"
          LAST="$(git log -1 --format='%h %s' -- $STALE | cut -c1-80)"
          echo "::warning::Instructions changed without cert_github.py: $STALE (last commit: $LAST). Recertifying."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            python3 scripts/cert_github.py . >/dev/null
            if git diff --quiet -- instruction-sync-status.json; then echo "already current on main"; exit 0; fi
            git add instruction-sync-status.json
            git commit -q -m "Robot: recertify instructions ($STALE) after $LAST"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1

      - name: Validate master and generate deterministic project status
        shell: bash
        run: |
          set -euo pipefail
          SYNCED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          rm -f /tmp/project-status.json
          set +e
          python3 scripts/build_project_status.py /tmp/drive-video-prompts.md --output /tmp/project-status.json --synced-at "$SYNCED_AT" --topview-status-file topview-status.json --topview-task-map-file topview-task-map.json --previous-status-file project-status.json --previous-master-file video-prompts.md --revision-timezone Europe/Moscow
          VALIDATOR_RC=$?
          set -e
          STATUS_PATH=/tmp/project-status.json MASTER_PATH=/tmp/drive-video-prompts.md EXPECTED_SYNCED_AT="$SYNCED_AT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          status_path = Path(os.environ["STATUS_PATH"])
          master_path = Path(os.environ["MASTER_PATH"])
          if not status_path.is_file() or status_path.stat().st_size == 0:
              raise SystemExit("validator did not create a fresh project-status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          expected_hash = hashlib.sha256(master_path.read_bytes()).hexdigest()
          if status.get("canonical_master_sha256") != expected_hash:
              raise SystemExit("generated status does not match the fresh master hash")
          if status.get("synced_at") != os.environ["EXPECTED_SYNCED_AT"]:
              raise SystemExit("generated status is not from the current validator invocation")
          PY
          if [ "$VALIDATOR_RC" -ne 0 ]; then
            STATUS_HEALTH="$(python3 -c 'import json; print(json.load(open("/tmp/project-status.json"))["health"])')"
            if [ "$STATUS_HEALTH" != "error" ]; then
              echo "Validator exited non-zero without a generated health=error snapshot." >&2
              exit "$VALIDATOR_RC"
            fi
            echo "Validator reported non-green health; publishing the verified fresh error status."
          fi

      - name: Repair mirrors only when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Other authorized writers (Topview/instruction telemetry) may advance
          # main while this job is running. Always rebuild on the newest remote
          # head and retry instead of failing with a non-fast-forward push.
          for attempt in 1 2 3 4; do
            echo "Sync push attempt $attempt/4"
            git fetch origin main
            git reset --hard origin/main

            # Canonical master = GitHub main (owner decision 11.10.2026); re-read the newest head on every retry.
            cp video-prompts.md /tmp/drive-video-prompts.md
            grep -q '^# Актуальные видео-сцены и промты' /tmp/drive-video-prompts.md
            grep -q 'Канонический источник' /tmp/drive-video-prompts.md

            SYNCED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            rm -f /tmp/project-status.json
          set +e
          python3 scripts/build_project_status.py /tmp/drive-video-prompts.md --output /tmp/project-status.json --synced-at "$SYNCED_AT" --topview-status-file topview-status.json --topview-task-map-file topview-task-map.json --previous-status-file project-status.json --previous-master-file video-prompts.md --revision-timezone Europe/Moscow
          VALIDATOR_RC=$?
          set -e
          STATUS_PATH=/tmp/project-status.json MASTER_PATH=/tmp/drive-video-prompts.md EXPECTED_SYNCED_AT="$SYNCED_AT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          status_path = Path(os.environ["STATUS_PATH"])
          master_path = Path(os.environ["MASTER_PATH"])
          if not status_path.is_file() or status_path.stat().st_size == 0:
              raise SystemExit("validator did not create a fresh project-status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          expected_hash = hashlib.sha256(master_path.read_bytes()).hexdigest()
          if status.get("canonical_master_sha256") != expected_hash:
              raise SystemExit("generated status does not match the fresh master hash")
          if status.get("synced_at") != os.environ["EXPECTED_SYNCED_AT"]:
              raise SystemExit("generated status is not from the current validator invocation")
          PY
          if [ "$VALIDATOR_RC" -ne 0 ]; then
            STATUS_HEALTH="$(python3 -c 'import json; print(json.load(open("/tmp/project-status.json"))["health"])')"
            if [ "$STATUS_HEALTH" != "error" ]; then
              echo "Validator exited non-zero without a generated health=error snapshot." >&2
              exit "$VALIDATOR_RC"
            fi
            echo "Validator reported non-green health; publishing the verified fresh error status."
          fi

            if ! cmp -s /tmp/drive-video-prompts.md video-prompts.md; then
              cp /tmp/drive-video-prompts.md video-prompts.md
            fi

            # No-op aware publish: a status that differs only by volatile check
            # timestamps is not committed again until the heartbeat is due, so the
            # public "last check" never ages past the 240-minute freshness limit
            # (scripts/check_public_freshness.py) while half of the empty Pages
            # deploys disappear. Any content change is always committed at once.
            MASTER_CHANGED=0
            git diff --quiet -- video-prompts.md || MASTER_CHANGED=1
            DECISION="$(MASTER_CHANGED=$MASTER_CHANGED python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          VOLATILE = {"synced_at", "age_hours", "age_hours_at_status_build"}
          HEARTBEAT_MIN = 180  # owner decision D5 (10.10.2026): pulse every 3 h, freshness limit 4 h
          def strip(x):
              if isinstance(x, dict):
                  return {k: strip(v) for k, v in x.items() if k not in VOLATILE}
              if isinstance(x, list):
                  return [strip(v) for v in x]
              return x
          try:
              old = json.load(open("project-status.json", encoding="utf-8-sig"))
          except Exception:
              print("publish"); raise SystemExit
          new = json.load(open("/tmp/project-status.json", encoding="utf-8"))
          if os.environ.get("MASTER_CHANGED") == "1" or strip(old) != strip(new):
              print("publish"); raise SystemExit
          try:
              last = datetime.fromisoformat(str(old.get("synced_at")).replace("Z", "+00:00"))
              age = (datetime.now(timezone.utc) - last).total_seconds() / 60
          except Exception:
              age = float("inf")
          print("heartbeat" if age >= HEARTBEAT_MIN else "skip")
          PY
          )"
            echo "Status publish decision: $DECISION"
            if [ "$DECISION" != "skip" ]; then
              cp /tmp/project-status.json project-status.json
            fi

            # Validate every project's current master in the same scheduled cycle.
            # projects.py publishes content changes immediately and a real check every 180 min.
            PROJECTS_RC=0
            python3 scripts/projects.py . status --write || PROJECTS_RC=$?
            python3 scripts/queue_readiness.py .
            git add video-prompts.md project-status.json projects/*/project-status.json ops/queue-readiness.json
            if git diff --cached --quiet; then
              echo "Master mirror and project status are current; health checks passed."
              exit "$PROJECTS_RC"
            fi

            if [ "$DECISION" = "heartbeat" ]; then
              git commit -m "Sync heartbeat: GitHub master unchanged, verification time refreshed"
            else
              git commit -m "Rebuild project status from canonical GitHub master"
            fi
            if git push origin HEAD:main; then
              exit "$PROJECTS_RC"
            fi

            echo "Remote main advanced during sync; retrying from the newest head." >&2
          done

          echo "Unable to publish project status after 4 retries." >&2
          exit 1

      - name: Drive copy drift guard (Drive is read-only since 11.10.2026)
        # If the Drive copy of the master holds content that never existed in GitHub,
        # someone edited Drive directly. Never pull it over GitHub: open ONE issue
        # 'drive-drift' so an agent ports the edit into GitHub; close it when resolved.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # The job checkout is shallow (depth 1): without history the guard knows only the newest
          # master and calls every older-but-genuine Drive copy "drift" (false issue #33, 22.10.2026).
          git fetch -q --shallow-since="10 days ago" origin main && git reset -q --hard origin/main || exit 0
          curl -sL --fail --retry 3 "https://drive.usercontent.google.com/download?id=1yoUVfEAumOClvlBg8prFIX_BFFfoCZqj&export=download&confirm=t" -o /tmp/drive-copy.md || { echo "Drive copy unreachable; skip"; exit 0; }
          if grep -qi '<!doctype html\|accounts.google.com' /tmp/drive-copy.md; then echo "Drive returned HTML; skip"; exit 0; fi
          python3 - <<'PY' > /tmp/drift.txt
          import hashlib, subprocess
          drive = open("/tmp/drive-copy.md", "rb").read()
          if drive.startswith(b"\xef\xbb\xbf"):
              drive = drive[3:]
          h = hashlib.sha256(drive).hexdigest()
          revs = subprocess.run(["git", "log", "-n", "200", "--format=%H", "--", "video-prompts.md"], capture_output=True, text=True).stdout.split()
          known = set()
          for r in revs:
              b = subprocess.run(["git", "show", f"{r}:video-prompts.md"], capture_output=True).stdout
              known.add(hashlib.sha256(b).hexdigest())
          print("drift" if h not in known else "ok", h[:16])
          PY
          read -r STATE HASH < /tmp/drift.txt
          echo "Drive copy: $STATE $HASH"
          # issues labelled drive-copy-files belong to the daily copy refresh (drive-write.yml), not to this master guard
          OPEN="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=drive-drift&per_page=10" --jq '[.[] | select(all(.labels[]; .name != "drive-copy-files"))][0].number // empty' 2>/dev/null || true)"
          if [ "$STATE" = "drift" ] && [ -z "$OPEN" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/labels" -f name=drive-drift -f color=fbca04 >/dev/null 2>&1 || true
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="Drive-копия master изменена вручную (sha ${HASH}) — перенести правку в GitHub" \
              -f body="С 11.10.2026 главная копия master — GitHub main, Drive — только копия для чтения. На Drive обнаружено содержимое, которого не было в GitHub. GitHub НЕ перезаписан. Агент: сравнить Drive-копию с GitHub, перенести осмысленную правку в GitHub обычным каноническим циклом, затем обновить Drive-копию из GitHub." \
              -f "labels[]=drive-drift" >/dev/null && echo "drift issue opened"
          elif [ "$STATE" = "ok" ] && [ -n "$OPEN" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${OPEN}" -f state=closed >/dev/null && echo "drift issue closed"
          fi

      - name: Alert when the unified monitor is silent for more than 3 hours
        # Owner decision D3 (10.10.2026). Opens ONE GitHub issue (repo notifications
        # reach the owner by e-mail) and closes it when telemetry is fresh again.
        # Best-effort: never fails the sync and never touches Topview or canon.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git fetch -q origin main && git reset -q --hard origin/main || exit 0
          read -r STATE DETAIL < <(python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          LIMIT_MIN = 240  # temporary (owner 11.10 06:00): monitor every 3 h until weekly limit reset Fri 16.10; restore 180 with hourly schedule
          now = datetime.now(timezone.utc)
          def age_key(v):
              try:
                  return datetime.fromisoformat(str(v).replace("Z", "+00:00"))
              except Exception:
                  return datetime.min.replace(tzinfo=timezone.utc)
          def age(v):
              try:
                  return (now - datetime.fromisoformat(str(v).replace("Z", "+00:00"))).total_seconds() / 60
              except Exception:
                  return float("inf")
          try:
              tv = json.load(open("topview-status.json", encoding="utf-8")).get("checked_at")
          except Exception:
              tv = None
          # Only HEALTHY monitor cycles count as liveness (owner rule 11.10): a degraded,
          # errored or phase-incomplete cycle must not keep the alert quiet.
          try:
              st = json.load(open("automation-monitor-status.json", encoding="utf-8"))
              cand = [st.get("last_successful_cycle_at")] + list((st.get("last_successful_by_runner") or {}).values())
              cyc = st.get("last_scheduled_cycle") or {}
              if cyc.get("health") == "ok" and not cyc.get("phases_missing"):
                  cand.append(cyc.get("completed_at"))
              cand = [c for c in cand if c]
              mon = max(cand, key=age_key) if cand else None
          except Exception:
              mon = None
          a_tv, a_mon = age(tv), age(mon)
          # The monitor cycle is the signal; Topview age is used only if the cycle record is missing.
          state = "silent" if (a_mon if mon else a_tv) > LIMIT_MIN else "ok"
          fmt = lambda m: "нет данных" if m == float("inf") else f"{m/60:.1f} ч"
          print(state, f"Topview_checked_at={tv}({fmt(a_tv)})_last_healthy_monitor_cycle={mon}({fmt(a_mon)})")
          PY
          )
          echo "Monitor watchdog: $STATE $DETAIL"
          OPEN="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=monitor-alert&per_page=5" --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ "$STATE" = "silent" ] && [ -z "$OPEN" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/labels" -f name=monitor-alert -f color=d93f0b >/dev/null 2>&1 || true
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="AI Film: монитор молчит больше 3 ч" \
              -f body="Автоматическое оповещение (решение владельца D3). Последние отметки: ${DETAIL//_/ }. Монитор публикует Topview только из ChatGPT: проверьте задачу «AI Film — единый монитор» (ID 6aac794245e481919ee7155c461cc77e) и лимиты ChatGPT. Дубль не создавать. Issue закроется сам, когда данные снова станут свежими." \
              -f "labels[]=monitor-alert" >/dev/null && echo "alert issue opened"
          elif [ "$STATE" = "ok" ] && [ -n "$OPEN" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${OPEN}/comments" -f body="Данные снова свежие: ${DETAIL//_/ }. Закрываю автоматически." >/dev/null
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${OPEN}" -f state=closed >/dev/null && echo "alert issue closed"
          fi
          exit 0

      - name: Publish CI state change for the Control Center
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [ "$JOB_STATUS" = "cancelled" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main || exit 0
            CHANGED="$(python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path = "ci-status.json"
          try:
              data = json.load(open(path, encoding="utf-8"))
          except Exception:
              data = {"schema_version": 1, "workflow": "sync-from-drive.yml"}
          status = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          if data.get("last_conclusion") == status:
              print("no"); raise SystemExit
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          data["last_conclusion"] = status
          if status == "failure":
              data["last_failure_at"] = now
              data["last_failure_run_url"] = os.environ["RUN_URL"]
          else:
              data["last_success_at"] = now
          data.pop("seeded_from", None)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("yes")
          PY
          )"
            [ "$CHANGED" = "yes" ] || exit 0
            git add ci-status.json
            git commit -q -m "CI state: sync-from-drive $JOB_STATUS"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not publish CI state change (best effort)." >&2
          exit 0

  owner_decisions:
    name: Apply deterministic owner buttons (Supabase -> ledger and canonical slow)
    needs: [sync]
    # Owner-approved 12.10.2026: process buttons every 30 min and on direct human push.
    # Do not recurse on bot pushes; commit-before-ack and rebase safety remain.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Phase 1 - bad result button (ledger only)
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::notice::Owner sync not configured: missing SUPABASE_SERVICE_ROLE_KEY GitHub Actions secret"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          applied=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -f /tmp/owner-decisions-plan.json
            python3 scripts/process_owner_decisions.py prepare --plan /tmp/owner-decisions-plan.json
            count="$(python3 -c 'import json; print(len(json.load(open("/tmp/owner-decisions-plan.json"))["updates"]))')"
            if [ "$count" -eq 0 ]; then
              echo "No deterministic buttons awaiting processing."
              applied=1
              break
            fi
            python3 scripts/validate_review_ledger.py
            git add review-ledger.json
            if git diff --cached --quiet; then
              python3 scripts/process_owner_decisions.py ack --plan /tmp/owner-decisions-plan.json
              applied=1
              break
            fi
            git commit -m "Owner panel: apply $count verified decisions to review ledger"
            if git push origin HEAD:main; then
              python3 scripts/process_owner_decisions.py ack --plan /tmp/owner-decisions-plan.json
              applied=1
              break
            fi
            echo "GitHub main changed concurrently; re-reading latest ledger and retrying ($attempt/4)"
          done
          if [ "$applied" -ne 1 ]; then
            echo "Failed to publish reviewed owner decisions after retries" >&2
            exit 1
          fi

      - name: Phase 2 - master and editorial owner buttons (slow release)
        # Explicit owner approval 12.10: ON by default. An explicit GitHub variable
        # ROBOT_MASTER_ACTIONS=off pauses the phase. Conflicting/active scenes are guarded
        # inside robot_master_actions.py (never auto-generate or approve by Topview).
        if: always() && !cancelled()
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROBOT_MASTER_ACTIONS: ${{ vars.ROBOT_MASTER_ACTIONS || 'on' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::notice::Master actions not configured: missing SUPABASE_SERVICE_ROLE_KEY GitHub Actions secret"
            exit 0
          fi
          python3 scripts/robot_master_actions.py

      - name: Phase 3 - site buttons (launch queue, owner tasks inbox, reference feedback)
        # Owner approval 17.10.2026 (project thread): queue ▲/▼/убрать/в очередь change only
        # ops/topview-launch-queue.json and only while the canon lock is free; text tasks go to the
        # inbox ops/owner-tasks.json for Claude/ChatGPT; nothing is launched or approved here.
        if: always() && !cancelled()
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::notice::Site actions not configured: missing SUPABASE_SERVICE_ROLE_KEY GitHub Actions secret"
            exit 0
          fi
          python3 scripts/robot_site_actions.py

      - name: Phase 4 - buttons of the other projects (projects/<id>/ only)
        # Owner decision 20.10.2026 (projects/README.md): rows tagged value "project:<id>" or a task of
        # projects/topview-projects.json. Phases 1-3 skip them; this phase changes only the project's
        # queue, review ledger and master. Never launches, approves or deletes a Topview task.
        if: always() && !cancelled()
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
