name: Sync canonical master from Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'SYNC-TRIGGER.txt'
      - '.github/workflows/sync-from-drive.yml'
      - 'scripts/build_project_status.py'
      - 'instruction-sync-status.json'

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download canonical master from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1yoUVfEAumOClvlBg8prFIX_BFFfoCZqj&export=download&confirm=t" \
            -o /tmp/drive-video-prompts.md

          test -s /tmp/drive-video-prompts.md
          if grep -qi '<!doctype html\|accounts.google.com' /tmp/drive-video-prompts.md; then
            echo "Refusing to use HTML/login response as video-prompts.md" >&2
            exit 1
          fi
          grep -q '^# Актуальные видео-сцены и промты' /tmp/drive-video-prompts.md
          grep -q 'Канонический источник' /tmp/drive-video-prompts.md

      - name: Validate master and generate deterministic project status
        shell: bash
        run: |
          set -euo pipefail
          SYNCED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/build_project_status.py /tmp/drive-video-prompts.md --output /tmp/project-status.json --synced-at "$SYNCED_AT"

      - name: Repair mirrors only when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Other authorized writers (Topview/instruction telemetry) may advance
          # main while this job is running. Always rebuild on the newest remote
          # head and retry instead of failing with a non-fast-forward push.
          for attempt in 1 2 3 4; do
            echo "Sync push attempt $attempt/4"
            git fetch origin main
            git reset --hard origin/main

            SYNCED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            python3 scripts/build_project_status.py /tmp/drive-video-prompts.md --output /tmp/project-status.json --synced-at "$SYNCED_AT"

            if ! cmp -s /tmp/drive-video-prompts.md video-prompts.md; then
              cp /tmp/drive-video-prompts.md video-prompts.md
            fi

            if ! cmp -s /tmp/project-status.json project-status.json; then
              cp /tmp/project-status.json project-status.json
            fi

            git add video-prompts.md project-status.json
            if git diff --cached --quiet; then
              echo "Master mirror and project status are current; health checks passed."
              exit 0
            fi

            git commit -m "Sync Drive master and generated project status"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Remote main advanced during sync; retrying from the newest head." >&2
          done

          echo "Unable to publish Drive mirror after 4 retries." >&2
          exit 1
