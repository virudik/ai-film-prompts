name: Owner repair verification 2026-11-15

# Temporary, unscheduled executor of the exact reviewed repair at the pinned commit.
# No provider calls, new generations, permissions changes or secret access.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-github-errors-20261115.yml']
permissions:
  contents: write
concurrency:
  group: owner-repair-20261115
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Execute pinned reviewed repair with all lease, hash, test and CAS gates
        env:
          REPAIR_HOLDER: chatgpt:ordinary:c9ff470f-280e-4cc6-8b05-04c63cca721b
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin e8b87df78ad62df5438cfec249e67b7221f286e8
          python3 - <<'PY'
          import hashlib, subprocess, textwrap
          revision = 'e8b87df78ad62df5438cfec249e67b7221f286e8'
          path = '.github/workflows/repair-github-errors-20261115.yml'
          raw = subprocess.check_output(['git', 'show', revision + ':' + path])
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert actual == '4e519321cada1f2fef36fe22b56243af973feced'
          start = "          cat > /tmp/owner-repair-20261115.py <<'PY'\n"
          code = textwrap.dedent(raw.decode().split(start, 1)[1].split('\n          PY\n', 1)[0])
          lines = code.splitlines()
          bad = [i for i, line in enumerate(lines) if line.strip().startswith('new = new.replace(')]
          assert len(bad) == 1
          # YAML already removes block indentation; preserve the test's eight spaces.
          lines.pop(bad[0])
          code = '\n'.join(lines) + '\n'
          exec(compile(code, '/tmp/reviewed-owner-repair.py', 'exec'), {'__name__': '__main__'})
          PY
