<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Film — Персонажи / Референсы</title>
<style>
:root{color-scheme:dark;--bg:#090b0e;--panel:#101419;--panel2:#151b22;--text:#edf2f7;--muted:#8f9aa6;--line:#28313b;--accent:#7dbbff;--warn:#ffd179}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -20%,rgba(75,124,185,.12),transparent 34%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1180px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.back{border:1px solid var(--line);padding:8px 11px;border-radius:9px;background:var(--panel)}h1{font-size:28px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:5px}.search{width:100%;margin:15px 0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#0d1116;color:var(--text)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:14px;display:grid;grid-template-columns:minmax(300px,480px) minmax(0,1fr);gap:16px;align-items:start}.photo{width:100%;max-width:480px;justify-self:center;height:auto;min-height:220px;border:1px solid #35414e;border-radius:10px;background:#ececec;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#8ea0b2;font-weight:800;text-align:center}.photo a{display:block;width:100%;height:auto}.photo img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;image-rendering:auto;cursor:zoom-in}.variants{margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}.variant{font-size:11px;color:#cbd4dd;margin-top:4px}.unassigned{font-size:10px;color:var(--warn);border:1px solid #66562f;padding:3px 7px;border-radius:999px;display:inline-block;margin-top:7px}.name{font-weight:850;font-size:15px}.alias{font-size:9px;color:#7f8b97;margin-top:2px}.row{font-size:12px;margin-top:6px;color:#cbd4dd}.row b{color:white}.scenes{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.scene{font-size:10px;border:1px solid #3d5772;padding:3px 7px;border-radius:999px;color:#b9d8f7}.rules{margin:0 0 14px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 13px;color:var(--muted);font-size:11px;line-height:1.45}.rules b{color:#e3eaf1}.empty{padding:18px;color:var(--muted)}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:92vh;object-fit:contain;box-shadow:0 18px 60px rgba(0,0,0,.45)}.lightbox-close{position:fixed;right:18px;top:16px;border:1px solid #596673;background:#11171d;color:white;border-radius:9px;padding:8px 11px;font-size:18px;cursor:pointer}
@media(max-width:820px){.grid{grid-template-columns:1fr}.card{grid-template-columns:1fr}.photo{width:100%;max-width:480px;height:auto;min-height:0;margin:0 auto}.photo img{max-height:none}h1{font-size:23px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><h1>Персонажи / Референсы</h1><div class="sub">Отдельный production-раздел. Подтверждённые model sheets персонажей; один персонаж — одна карточка, сценические варианты собраны внутри.</div></div><a class="back" href="index.html">← К сценам</a></div>
<input id="q" class="search" placeholder="Найти персонажа, сцену или вариант одежды…">
<div id="rules" class="rules"><b>Правило референсов:</b> загрузка…</div>
<div id="grid" class="grid"><div class="empty">Загрузка реестра…</div></div>
</main>
<div id="lightbox" class="lightbox" aria-hidden="true"><button id="lightboxClose" class="lightbox-close" aria-label="Закрыть">×</button><img id="lightboxImage" alt="Полноразмерный model sheet"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let reg=null;
function openLightbox(src,alt){
 const box=document.getElementById('lightbox'),img=document.getElementById('lightboxImage');
 img.src=src;img.alt=alt||'Model sheet';box.classList.add('open');box.setAttribute('aria-hidden','false');
}
function closeLightbox(){const box=document.getElementById('lightbox');box.classList.remove('open');box.setAttribute('aria-hidden','true')}
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const chars=(reg?.characters||[]).filter(ch=>JSON.stringify(ch).toLowerCase().includes(q));
 document.getElementById('grid').innerHTML=chars.length?chars.map(ch=>{
  const p=ch.preview||{},src=ch.model_sheet?.public_image||p.url||'',full=ch.model_sheet?.full_image||src,img=src?'<img class="zoomable" src="'+esc(src)+'" data-full="'+esc(full)+'" alt="'+esc(ch.name)+'" title="Открыть оригинал">':'Фото пока не подтверждено';
  const sceneList=ch.scenes||[],scenes=sceneList.map(id=>'<a class="scene" href="index.html#scene-'+id+'">Сцена '+id+'</a>').join('');
  const add=(ch.model_sheet?.additional||[]).length?' + '+ch.model_sheet.additional.join(', '):'';
  const variants=(ch.variants||[]).map(v=>'<div class="variant"><b>'+esc(v.label||'Вариант')+':</b> '+esc(v.notes||'')+(v.scenes?.length?' · сцены '+v.scenes.join(', '):'')+'</div>').join('');
  return '<article class="card"><div><div class="photo">'+img+'</div></div><div><div class="name">'+esc(ch.name)+'</div>'+((ch.aliases||[]).length?'<div class="alias">Технические имена: '+esc((ch.aliases||[]).join(' · '))+'</div>':'')+(sceneList.length?'<div class="scenes">'+scenes+'</div>':'<span class="unassigned">Пока не привязана к активной сцене</span>')+'<div class="row"><b>Основной референс:</b> '+esc(ch.model_sheet?.primary||'—')+esc(add)+'</div><div class="row"><b>Одежда / образ:</b> '+esc(ch.outfit_variant||'—')+'</div>'+(variants?'<div class="variants"><b>Сценические варианты</b>'+variants+'</div>':'')+'</div></article>';
 }).join(''):'<div class="empty">Ничего не найдено.</div>';
 document.querySelectorAll('.zoomable').forEach(img=>img.addEventListener('click',()=>openLightbox(img.dataset.full||img.src,img.alt)));
 const rules=reg?.non_character_reference_rules||[];
 document.getElementById('rules').innerHTML='<b>Правило референсов:</b> '+esc(rules.join(' · '));
}
fetch('character-references.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{reg=x;render()}).catch(e=>document.getElementById('grid').innerHTML='<div class="empty">Не удалось загрузить character-references.json</div>');
document.getElementById('q').addEventListener('input',render);
document.getElementById('lightboxClose').onclick=closeLightbox;
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLightbox()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
</script></body></html>
