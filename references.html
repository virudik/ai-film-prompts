<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Film — Персонажи / Референсы</title>
<style>
:root{color-scheme:dark;--bg:#090b0e;--panel:#101419;--panel2:#151b22;--text:#edf2f7;--muted:#8f9aa6;--line:#28313b;--accent:#7dbbff;--warn:#ffd179}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -20%,rgba(75,124,185,.12),transparent 34%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1180px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.back{border:1px solid var(--line);padding:8px 11px;border-radius:9px;background:var(--panel)}h1{font-size:28px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:5px}.search{width:100%;margin:15px 0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#0d1116;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:12px;display:grid;grid-template-columns:190px minmax(0,1fr);gap:13px}.photo{width:190px;height:128px;border:1px solid #35414e;border-radius:10px;background:linear-gradient(145deg,#1d2731,#0b1015);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#8ea0b2;font-weight:800;text-align:center}.photo img{width:100%;height:100%;object-fit:cover}.name{font-weight:850;font-size:15px}.alias{font-size:10px;color:var(--muted)}.row{font-size:12px;margin-top:6px;color:#cbd4dd}.row b{color:white}.scenes{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.scene{font-size:10px;border:1px solid #3d5772;padding:3px 7px;border-radius:999px;color:#b9d8f7}.priority{font-size:11px;color:var(--warn);margin-top:7px}.preview-note{font-size:10px;color:var(--muted);margin-top:6px}.rules{margin-top:18px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:13px;color:var(--muted);font-size:12px}.empty{padding:18px;color:var(--muted)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.card{grid-template-columns:1fr}.photo{width:100%;height:190px}h1{font-size:23px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><h1>Персонажи / Референсы</h1><div class="sub">Отдельный production-раздел. Model sheet имеет приоритет над групповыми и environment-референсами.</div></div><a class="back" href="index.html">← К сценам</a></div>
<input id="q" class="search" placeholder="Найти персонажа, сцену или вариант одежды…">
<div id="grid" class="grid"><div class="empty">Загрузка реестра…</div></div>
<div id="rules" class="rules"></div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let reg=null;
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const chars=(reg?.characters||[]).filter(ch=>JSON.stringify(ch).toLowerCase().includes(q));
 document.getElementById('grid').innerHTML=chars.length?chars.map(ch=>{
  const p=ch.preview||{}, img=p.url?'<img src="'+esc(p.url)+'" alt="'+esc(ch.name)+'">':'Фото пока не подтверждено';
  const scenes=(ch.scenes||[]).map(id=>'<a class="scene" href="index.html#scene-'+id+'">Сцена '+id+'</a>').join('');
  const add=(ch.model_sheet?.additional||[]).length?' + '+ch.model_sheet.additional.join(', '):'';
  return '<article class="card"><div><div class="photo">'+img+'</div>'+(p.note?'<div class="preview-note">'+esc(p.note)+'</div>':'')+'</div><div><div class="name">'+esc(ch.name)+'</div><div class="alias">'+esc((ch.aliases||[]).join(' · '))+'</div><div class="scenes">'+scenes+'</div><div class="row"><b>Основная model sheet:</b> '+esc(ch.model_sheet?.primary||'—')+esc(add)+'</div><div class="row"><b>Одежда / вариант:</b> '+esc(ch.outfit_variant||'—')+'</div><div class="priority"><b>Приоритет:</b> '+esc(ch.reference_priority||'—')+'</div></div></article>';
 }).join(''):'<div class="empty">Ничего не найдено.</div>';
 document.getElementById('rules').textContent=(reg?.non_character_reference_rules||[]).join(' · ');
}
fetch('character-references.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{reg=x;render()}).catch(e=>document.getElementById('grid').innerHTML='<div class="empty">Не удалось загрузить character-references.json</div>');
document.getElementById('q').addEventListener('input',render);
</script></body></html>
